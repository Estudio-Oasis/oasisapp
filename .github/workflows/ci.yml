name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck, Knip, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint (no unused imports / dead code)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Knip (no orphan files / unused deps / duplicates)
        run: bun run knip --no-exit-code --reporter compact
        continue-on-error: false

      - name: Tests
        run: bun run test
